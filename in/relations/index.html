<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relations — Sponic Garden</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="relations.css">
</head>
<body>

  <div id="auth-overlay">
    <div class="auth-card">
      <h2>🌿 Relations</h2>
      <p class="auth-subtitle">Sponic Garden — Admin only</p>
      <button id="auth-google-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/><path fill="#fff" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#fff" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/><path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/></svg>
        Sign in with Google
      </button>
      <div class="auth-error hidden" id="auth-error"></div>
    </div>
  </div>

  <header id="app-header" class="hidden">
    <a href="./" class="header-home"><span class="header-logo">🌿</span><h1>Relations</h1></a>
    <nav id="pipeline-nav"></nav>
    <span class="header-user" id="header-user-email"></span>
    <button class="btn-sign-out" id="btn-sign-out">Sign out</button>
  </header>

  <main id="app-main" class="hidden"></main>

  <div id="toast-container"></div>

  <script>
    const SUPABASE_URL  = 'https://aphrrfprbixmhissnjfn.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwaHJyZnByYml4bWhpc3NuamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MzA0MjUsImV4cCI6MjA4NTUwNjQyNX0.yYkdQIq97GQgxK7yT2OQEPi5Tt-a7gM45aF8xjSD6wk';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const authOverlay = document.getElementById('auth-overlay');
    const authBtn     = document.getElementById('auth-google-btn');
    const authError   = document.getElementById('auth-error');
    const appHeader   = document.getElementById('app-header');
    const appMain     = document.getElementById('app-main');

    async function getAdminEmails() {
      const { data } = await sb.from('config').select('value').eq('key', 'site.admin_emails').single();
      try { return JSON.parse(data?.value || '[]'); } catch { return []; }
    }

    async function handleSession(session) {
      if (!session) { showAuthOverlay(); return; }
      const adminEmails = await getAdminEmails();
      if (adminEmails.length > 0 && !adminEmails.includes(session.user.email)) {
        await sb.auth.signOut();
        showAuthError('Access denied. Admin account required.');
        return;
      }
      hideAuthOverlay(session.user);
    }

    function showAuthOverlay() {
      document.body.classList.add('auth-locked');
      authOverlay.style.display = '';
      appHeader.classList.add('hidden');
      appMain.classList.add('hidden');
    }

    function hideAuthOverlay(user) {
      document.body.classList.remove('auth-locked');
      authOverlay.style.display = 'none';
      appHeader.classList.remove('hidden');
      appMain.classList.remove('hidden');
      document.getElementById('header-user-email').textContent = user.email;
      if (window.initRelations) window.initRelations(user, sb);
    }

    function showAuthError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    authBtn.addEventListener('click', async () => {
      authBtn.disabled = true;
      authError.classList.add('hidden');
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href },
      });
      if (error) { showAuthError(error.message); authBtn.disabled = false; }
    });

    document.getElementById('btn-sign-out').addEventListener('click', async () => {
      await sb.auth.signOut();
      showAuthOverlay();
    });

    sb.auth.getSession().then(({ data: { session } }) => handleSession(session));
    sb.auth.onAuthStateChange((_event, session) => handleSession(session));
  </script>

  <script src="relations.js"></script>
</body>
</html>
